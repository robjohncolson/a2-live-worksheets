<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>Algebra 2</title>
<!-- Mobile-first Algebra 2 launcher: lessons, worksheets, checks, and flashcards. -->
<style>
  :root { /* Tango theme — mirrors the Desk tokens */
          --blue:#161616; --ink:#161616; --bg:#E5E3D2; --card:#F7F5EE; --line:#A9A79A;
          --accent:#FF5B19; --accent-ink:#A8330A; --second:#AECACD; --second-ink:#2F5A5E;
          --ok:#25663F; --ok-bg:#DEF0D3; --bad:#B03A2E; --bad-bg:#F1DDD3; --muted:#6E6C62; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body { font-family:-apple-system,Roboto,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--blue); color:#E5E3D2; border-bottom:3px solid var(--accent); z-index:5;
           padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  header h1 { margin:0; font-size:19px; font-weight:700; }
  header .who { font-size:12px; opacity:.9; margin-top:3px; }
  header .hdr-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  header .hdr-btn { background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35);
           border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; -webkit-tap-highlight-color:transparent; }
  header .hdr-btn:active { background:rgba(255,255,255,.28); }
  header #vhint { margin-top:6px; }
  main { padding:10px 12px 48px; max-width:680px; margin:0 auto; }
  details.unit { margin:0 0 8px; }
  details.unit > summary { list-style:none; cursor:pointer; padding:12px 14px; background:#F3F1E8;
           border:1px solid var(--line); border-radius:10px; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
  details.unit > summary::-webkit-details-marker { display:none; }
  details.unit > summary .caret { margin-left:auto; opacity:.55; transition:transform .15s; }
  details.unit[open] > summary .caret { transform:rotate(90deg); }
  .lesson { background:var(--card); border:1px solid var(--line); border-top:none; padding:10px 12px; }
  .lesson:first-of-type { border-top:1px solid var(--line); margin-top:6px; border-radius:10px 10px 0 0; }
  .lesson:last-of-type { border-radius:0 0 10px 10px; }
  .lesson .title { font-weight:600; font-size:14px; margin-bottom:8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { flex:1 1 auto; min-width:84px; text-align:center; padding:12px 8px; border-radius:9px;
         border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:600; color:var(--ink);
         text-decoration:none; cursor:pointer; }
  .btn:active { background:#DEDDE6; }
  .btn.ws { background:var(--second); border-color:#7FA5A9; }
  .btn.quiz { background:var(--ok-bg); border-color:#8FB893; }
  .btn.bloo { background:#DEDDE6; border-color:#A9A7C4; }
  .btn.fc { background:#F1E5CF; border-color:#D1B98A; }
  .btn[disabled] { opacity:.4; pointer-events:none; }
  header #gradepill { display:inline-block; margin-top:8px; background:rgba(255,255,255,.16);
           border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; }
  .lesson .title { display:flex; align-items:center; gap:8px; }
  .lesson .done-badge { margin-left:auto; font-size:11px; font-weight:700; color:var(--ok);
           background:var(--ok-bg); border:1px solid #8FB893; border-radius:999px; padding:1px 8px; white-space:nowrap; }
  /* Bonus lessons use a muted enrichment style. */
  .bonus-strip { margin-top:10px; border-top:2px dashed var(--line); padding-top:6px; }
  .bonus-head { font-size:12px; font-weight:700; color:var(--muted); padding:6px 4px 8px; }
  .lesson.bonus { background:#DEDDD3; filter:grayscale(.55); }
  .lesson.bonus .title { color:var(--muted); }
  .lesson.bonus .btn { opacity:.82; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; }

  /* Native flashcards overlay — fixed sheet with the mobile palette. */
  #fco { position:fixed; inset:0; background:var(--bg); display:none; z-index:60; flex-direction:column; }
  #fco.show { display:flex; }
  #fco .fc-bar { display:flex; gap:10px; align-items:center; background:var(--blue); color:#E5E3D2; border-bottom:3px solid var(--accent);
             padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px; }
  #fco .fc-bar .fc-title { margin:0; font-size:14px; font-weight:700; }
  #fco .fc-bar .fc-prog { font-size:12px; opacity:.9; margin-left:auto; }
  #fco .fc-bar button { background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35);
             border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; }
  #fco .fc-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; max-width:100%;
             width:100%; margin:0 auto; display:flex; flex-direction:column; }
  #fco .fc-timer { height:5px; background:#DEDDD3; border-radius:3px; overflow:hidden; margin-bottom:14px; display:none; }
  #fco.timed .fc-timer { display:block; }
  #fco .fc-timer > i { display:block; height:100%; width:100%; background:var(--accent); transition:width .95s linear; }
  #fco .fc-q { font-size:17px; font-weight:600; line-height:1.4; margin-bottom:16px; }
  #fco .fc-choice { display:block; width:100%; max-width:100%; min-height:44px; text-align:left; padding:14px 16px; margin-bottom:10px; border-radius:10px;
             border:1px solid var(--line); background:var(--card); font-size:15px; color:var(--ink); font-weight:500;
             white-space:normal; overflow-wrap:anywhere; }
  #fco .fc-choice:active { background:#DEDDE6; }
  #fco .fc-choice.right { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700; }
  #fco .fc-choice.wrong { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  #fco .fc-choice[disabled] { pointer-events:none; }
  #fco .fc-feedback { min-height:22px; margin-top:6px; font-size:14px; font-weight:600; }
  #fco .fc-next { margin-top:auto; padding:14px; border-radius:10px; border:0; background:var(--accent); color:var(--black,#161616);
             font-size:15px; font-weight:700; display:none; }
  #fco .fc-next.show { display:block; }
  /* Mode picker + result panels reuse .fc-body; big beveled choices. */
  #fco .fc-pick, #fco .fc-result { text-align:center; margin:auto 0; }
  #fco .fc-pick h2, #fco .fc-result h2 { font-size:20px; margin:0 0 6px; }
  #fco .fc-pick p, #fco .fc-result p { color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.4; }
  #fco .fc-mode { display:block; width:100%; padding:18px; margin-bottom:12px; border-radius:12px; border:1px solid var(--line);
             background:var(--card); font-size:16px; font-weight:700; color:var(--ink); }
  #fco .fc-result .fc-mode { max-width:100%; white-space:normal; overflow-wrap:anywhere; }
  #fco .fc-mode small { display:block; font-weight:500; font-size:12px; color:var(--muted); margin-top:4px; }
  #fco .fc-mode:active { background:#DEDDE6; }
  #fco .fc-mode.quick { background:#F1E5CF; border-color:#D1B98A; }
  #fco .fc-mode.full { background:var(--second); border-color:#7FA5A9; }
  #fco .fc-score { font-size:44px; font-weight:800; margin:8px 0; }
  #fco .fc-score.pass { color:var(--ok); } #fco .fc-score.fail { color:var(--bad); }
  #fco .fc-recap { text-align:left; margin:14px 0; font-size:14px; line-height:1.4; }
  #fco .fc-recap ul { margin:6px 0 0; padding-left:20px; }
  #fco .fc-recap li { margin-bottom:8px; overflow-wrap:anywhere; }
  #fco .fc-recap .fc-recap-answer, #fco .fc-perfect { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>📊 Algebra 2 <a href="teacher-app.html" style="float:right;color:#E5E3D2;opacity:.85;font-size:12px;font-weight:400;text-decoration:none;margin-top:3px">🔑 Teacher</a></h1>
  <div class="who" id="who">Not signed in.</div>
  <div class="hdr-row">
    <button id="signin-btn" class="hdr-btn" onclick="openNameFinder()">👤 Sign in</button>
  </div>
  <div id="gradepill" style="display:none"></div>
  
</header>
<main id="main"><div class="empty">Loading lessons…</div></main>



<div id="fco" role="dialog" aria-modal="true" aria-labelledby="fc-title">
  <div class="fc-bar">
    <button id="fc-full-deck" type="button">Full deck</button>
    <h2 class="fc-title" id="fc-title">🃏 Flashcards</h2>
    <span class="fc-prog" id="fc-prog"></span>
    <button type="button" onclick="closeFlashcards()">✕ Close</button>
  </div>
  <div class="fc-body" id="fc-body"><!-- mode picker / cards / result injected here --></div>
</div>

<!-- offline-config.js is GENERATED into the pack; it sets window.OFFLINE_MODE and,
     in a --play build, window.PLAY_BUILD + window.MEDIA_BASE_URL. mobile-home isn't in
     ROOT_FILES (build-android copies it in separately), so it must load this itself.
     Must be FIRST. On the web it 404s harmlessly (mobile-home is the APK home). -->
<script src="offline-config.js" onerror=""></script>
<script src="roster_config.js" onerror=""></script>
<script src="roster-client.js" onerror=""></script>
<!-- Signed receipts and durable local ledger storage. -->
<script src="receipt-verify.js" onerror=""></script>
<script src="ledger-store.js" onerror=""></script>


<!-- OFFLINE GRADING MESH Phase 1-2 — the student's device signing key + the
     submissions lane (self-sign raw work, gossip it beside grades). Inert on the
     web: SecureKeyStore only exists inside the APK. -->
<script src="receipt-sign.js" onerror=""></script>
<script src="secure-key.js" onerror=""></script>
<script src="student-key.js" onerror=""></script>
<script src="submission-store.js" onerror=""></script>
<script src="submission-capture.js" onerror=""></script>
<!-- FLASHCARDS (native) — the shared pure Blooket-flashcard engine + the gradebook
     ledger feeder, so the launcher runs flashcards IN-APP instead of deep-linking to
     the Desk. flashcards.js is byte-pinned to the Desk's inline engine by
     tests/flashcards-engine.test.js. offline-queue.js lets a finished deck queue its
     grade row when offline; gradebook-client.js is the same feeder the Desk uses. -->
<script src="flashcards.js" onerror=""></script>
<script src="lib/flashcard-flags.js" onerror=""></script>
<script src="lib/flashcard-sync.js" onerror=""></script>
<script src="offline-queue.js" onerror=""></script>
<script src="gradebook-client.js" onerror=""></script>
<script src="js/ced2026-crosswalk.js"></script>
<script src="js/ced2026-labels.js"></script>
<script>
(function () {
  var main = document.getElementById('main');
  var cedRegistry = { lessons: {} };
  configureCedLabels(function () { return cedRegistry; });
  // Fall 2026 CED (5-unit) group names; topic mapping lives in the shared helper.
  var NEW_UNIT_NAMES = {
    1:'Unit 1 · Exploring One-Variable Data & Collecting Data',
    2:'Unit 2 · Probability, Random Variables & Distributions',
    3:'Unit 3 · Inference for Categorical Data: Proportions',
    4:'Unit 4 · Inference for Quantitative Data: Means',
    5:'Unit 5 · Regression Analysis'
  };
  // Keep the existing numeric CED topic order; OLD ids still identify the lessons.
  function _topicKey(l){ var m=String(cedLabel(l.id).id).split('.'); return (parseInt(m[0],10)||0)*100+(parseInt(m[1],10)||0); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // Identity line + Sign-in button reflect the shared roster session (the same
  // localStorage session every bundled page uses). refreshIdentity() is re-run after
  // a sign-in so the student's name appears without a reload.
  function refreshIdentity() {
    if (typeof window.a2StudentGradesHidden === 'function' && window.a2StudentGradesHidden()) {
      var pill = document.getElementById('gradepill');
      if (pill) { pill.textContent = 'Your grade is in Schoology for now.'; pill.style.display = ''; }
    }
    var session = window.rosterClient && window.rosterClient.current();
    if (session && session.mustChangePassword) openMobilePasswordChange();
    var who = (window.rosterClient && rosterClient.current && rosterClient.current()) || null;
    var w = document.getElementById('who');
    var b = document.getElementById('signin-btn');
    if (who) {
      if (w) w.textContent = '👤 Signed in as ' + (who.realName || who.username || 'student');
      if (b) b.textContent = '⇄ Switch student';
    } else {
      if (w) w.textContent = 'Not signed in — sign in so your work counts toward your grade.';
      if (b) b.textContent = '👤 Sign in';
    }
  }
  function openMobilePasswordChange() {
    var existing = document.getElementById('mobile-password-change');
    if (existing && existing.open) return;
    if (existing) existing.remove();
    var dialog = document.createElement('dialog');
    dialog.id = 'mobile-password-change';
    dialog.setAttribute('aria-labelledby', 'mobile-password-title');
    dialog.style.cssText = 'max-width:340px;width:85%;border-radius:12px;padding:24px';
    dialog.innerHTML = '<h2 id="mobile-password-title">Set Your Password</h2>'
      + '<p>Choose a new password (at least 6 characters).</p>'
      + '<form><label>New password <input id="mobile-password-new" type="password" autocomplete="new-password" minlength="6" required></label>'
      + '<label>Confirm new password <input id="mobile-password-confirm" type="password" autocomplete="new-password" minlength="6" required></label>'
      + '<p id="mobile-password-error" role="alert"></p><button type="submit">Set Password</button></form>';
    dialog.addEventListener('cancel', function (e) { e.preventDefault(); });
    dialog.querySelector('form').onsubmit = async function (e) {
      e.preventDefault();
      var button = dialog.querySelector('button');
      if (button.disabled) return;
      var pw = dialog.querySelector('#mobile-password-new').value;
      var confirm = dialog.querySelector('#mobile-password-confirm').value;
      var error = dialog.querySelector('#mobile-password-error');
      if (pw.length < 6) { error.textContent = 'Use at least 6 characters.'; return; }
      if (pw !== confirm) { error.textContent = 'The two passwords do not match.'; return; }
      button.disabled = true;
      try {
        var result = await window.rosterClient.changePassword(pw);
        if (!result.ok) { error.textContent = result.error || 'Could not change password.'; return; }
        dialog.close();
        dialog.remove();
        refreshIdentity();
      } catch (_) { error.textContent = 'Could not change password. Try again.'; }
      finally { button.disabled = false; }
    };
    document.body.appendChild(dialog);
    dialog.showModal();
  }
  window.addEventListener('a2:password-change-required', openMobilePasswordChange);
  window.addEventListener('a2:session-expired', function () {
    var dialog = document.getElementById('mobile-password-change');
    if (dialog) dialog.remove();
    refreshIdentity();
    document.getElementById('signin-btn').click();
  });
  window.addEventListener('storage', function () { refreshIdentity(); });
  window.refreshIdentity = refreshIdentity;
  try { refreshIdentity(); } catch (e) {}

  function svcUrl() {
    var u = (typeof window.ROSTER_SERVICE_URL === 'string' && window.ROSTER_SERVICE_URL)
      || (typeof window.RAILWAY_ROSTER_URL === 'string' && window.RAILWAY_ROSTER_URL)
      || (typeof window.ROSTER_SERVER_URL === 'string' && window.ROSTER_SERVER_URL) || '';
    return String(u).replace(/\/$/, '');
  }
  function verifyRow(row) {
    // Verify-on-ingest for gossiped/QR'd rows: the shared BINDING verifier
    // (receipt-verify.js) — the signature must cover THIS row's grade fields, not just
    // "some bytes", or a harvested signature could be re-stapled to a forged score.
    try {
      if (!window.ReceiptVerify || typeof ReceiptVerify.verifyLedgerRow !== 'function') return Promise.resolve(false);
      return Promise.resolve(ReceiptVerify.verifyLedgerRow(row)).catch(function () { return false; });
    } catch (_) { return Promise.resolve(false); }
  }
  var _issuerReg = false;
  function registerIssuer(base) {
    if (_issuerReg || !window.ReceiptVerify || !Array.isArray(ReceiptVerify.ISSUERS) || !base || typeof fetch !== 'function') return Promise.resolve();
    return fetch(base + '/receipts/issuer').then(function (r) { return r && r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.enabled) return;
      var keys = (j.pubkeys && j.pubkeys.length) ? j.pubkeys : (j.pubkey ? [j.pubkey] : []);
      // registerIssuerKeys refuses any pubkey already bound to a student (§0.1c
      // disjointness) — falls back to a raw push if the guarded API isn't present.
      if (typeof ReceiptVerify.registerIssuerKeys === 'function') {
        ReceiptVerify.registerIssuerKeys(keys, { name: 'Roster', kind: 'roster' });
      } else {
        keys.forEach(function (pk) { if (pk && !ReceiptVerify.ISSUERS.some(function (i) { return i.pubkey === pk; })) ReceiptVerify.ISSUERS.push({ name: 'Roster', pubkey: pk, kind: 'roster' }); });
      }
      _issuerReg = true;
    }).catch(function () {});
  }

  // OFFLINE GRADING MESH Phase 1 — get-or-generate this student's device key,
  // register it (authenticated), and sync the class student trust set so gossiped
  // submissions can be verified. Inert on the web (StudentKey.available()===false).
  // Fire-and-forget; never blocks navigation or sign-in.
  function meshKeyBoot() {
    if (!window.StudentKey || !window.rosterClient) return Promise.resolve();
    var base = svcUrl();
    var token = null;
    try { token = rosterClient.token && rosterClient.token(); } catch (_) {}
    var p = StudentKey.available() ? StudentKey.ensure(window.rosterClient, base) : Promise.resolve();
    return p.then(function () { return token ? StudentKey.syncTrustSet(base, token) : null; }).catch(function () {});
  }
  window.meshKeyBoot = meshKeyBoot;

  // The submissions-lane verifier (student trust set). Fail-closed like verifyRow.

  // ── Sign-in: diamond-dial name finder (ported from the Desk) ──────────────────
  // Same 4-way narrowing pick as desk.html's _nf* wall: fetch
  // the class roster (section PeriodX), sort by name, and let the student "turn the
  // dial" (↑ ← → ↓) down to their own name — never typing a username — then just their
  // password. Success flows into rosterClient, so every signed grade receipt they earn
  // carries their `sid`. First sign-in needs the network; the session then persists.
  var ROSTER_CACHE_TTL_MS = 60 * 60 * 1000;

  function _periodToSection(period) {
    if (typeof period !== 'string' || !period) return 'PeriodX';
    if (/^Period/.test(period)) return period;
    if (/^[A-Za-z]$/.test(period)) return 'Period' + period.toUpperCase();
    return 'PeriodX';
  }
  function _fetchSectionRoster(section, opts) {
    if (!section) return Promise.resolve([]);
    var fresh = !!(opts && opts.fresh);
    var cacheKey = 'a2_desk_roster_cache_' + section;
    if (!fresh) { try {
      var raw = localStorage.getItem(cacheKey);
      if (raw) {
        var cached = JSON.parse(raw);
        if (cached && cached.ts && (Date.now() - cached.ts < ROSTER_CACHE_TTL_MS)) return Promise.resolve(cached.roster || []);
      }
    } catch (_) {} }
    var base = svcUrl();
    if (!base) return Promise.resolve([]);
    return fetch(base + '/roster/section/' + encodeURIComponent(section), fresh ? { cache: 'no-store' } : undefined)
      .then(function (res) { return res && res.ok ? res.json() : null; })
      .then(function (data) {
        var students = (data && data.ok && Array.isArray(data.students)) ? data.students : [];
        students.sort(function (a, b) { return (a.realName || '').localeCompare(b.realName || ''); });
        try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), roster: students })); } catch (_) {}
        return students;
      })
      .catch(function () { return []; });
  }
  function _fetchPeriodRoster(period, opts) {
    var primary = _periodToSection(period);
    return _fetchSectionRoster(primary, opts).then(function (rows) {
      if (rows.length > 0) return rows;
      if (primary !== 'PeriodX') return _fetchSectionRoster('PeriodX', opts);
      return [];
    });
  }

  function _nfEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function _nfFriendly(r) {
    var nm = (r && r.realName || '').trim();
    if (!nm) return (r && r.username) || '(unnamed)';
    var p = nm.split(/\s+/);
    if (p.length === 1) return p[0];
    return p[0] + ' ' + p[p.length - 1].charAt(0).toUpperCase() + '.';
  }
  function _nfRangeKey(r) {
    var nm = ((r && (r.realName || r.username)) || '').trim();
    if (!nm) return '?';
    return nm.charAt(0).toUpperCase() + (nm.charAt(1) || '').toLowerCase();
  }
  // Split [lo,hi] into up to 4 contiguous buckets. <=4 names -> one leaf per name.
  function _nfBuckets(lo, hi) {
    var n = hi - lo + 1, out = [];
    if (n <= 0) return out;
    if (n <= 4) { for (var i = lo; i <= hi; i++) out.push({ lo: i, hi: i, leaf: true }); return out; }
    var bs = Math.ceil(n / 4), start = lo;
    for (var b = 0; b < 4 && start <= hi; b++) {
      var end = (b === 3) ? hi : Math.min(start + bs - 1, hi);
      out.push({ lo: start, hi: end, leaf: false });
      start = end + 1;
    }
    return out;
  }

  var _nfRoster = [], _nfStack = [], _nfLo = 0, _nfHi = -1, _nfState = 'dial', _nfPicked = null;

  function openNameFinder() {
    if (!window.rosterClient || !rosterClient.signIn) { ; setTimeout(dlHide, 3000); return Promise.resolve(); }
    ;
    return _fetchPeriodRoster('PeriodX', { fresh: true }).then(function (roster) {
      ;
      _nfRoster = (roster || []).slice().sort(function (a, b) { return (a.realName || a.username || '').localeCompare(b.realName || b.username || ''); });
      if (!_nfRoster.length) { ; setTimeout(dlHide, 4000); return; }
      _nfLo = 0; _nfHi = _nfRoster.length - 1; _nfStack = []; _nfPicked = null;
      _nfEnsureOverlay();
      document.getElementById('namefinder-overlay').style.display = 'flex';
      _nfRenderDial();
    }).catch(function () { ; ; setTimeout(dlHide, 3500); });
  }
  window.openNameFinder = openNameFinder;

  function _nfEnsureOverlay() {
    if (document.getElementById('namefinder-overlay')) return;
    var ov = document.createElement('div');
    ov.id = 'namefinder-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:100001;padding:16px';
    ov.innerHTML =
      '<style>'

  // ── Grade + per-lesson completion ────────────────────────────────────────────
  // Offline-cached: show the last-fetched grade immediately (so it works with no
  // network), then refresh from GET /grade when signed in + online. The grade is
  // computed server-side (authoritative) from the same ledger the app already pulls.
  var GRADE_KEY = 'a2_mobile_grade_v1';
  var _gradeByTopic = {}, _lastLessons = [];
  // Whose /grade filled _gradeByTopic (stamped at FETCH time from the token's owner,
  // and persisted inside the GRADE_KEY cache). The map + cache are device-global, so
  // on a shared device the best-wins floor must only trust the synced half when it
  // belongs to the CURRENT student — clearing on sign-in wouldn't cover a previous
  // student's still-in-flight /grade response landing late.
  var _gradeOwner = null;
  function _normTopic(s) { s = String(s == null ? '' : s); var m = s.match(/U?(\d+)[.\-_ ]?L?(\d+)/i); return m ? (m[1] + '.' + m[2]) : s; }

  // Populate the per-topic lesson-grade map + the header pill from a /grade payload.
  // repaint=true re-renders the tiles so their ✓ badges appear.
  function _applyGradeData(g, repaint) {
    if (!g) return;
    _gradeByTopic = {};
    var ls = Array.isArray(g.lessons) ? g.lessons
      : (g.lessons && typeof g.lessons === 'object') ? Object.keys(g.lessons).map(function (k) { var e = g.lessons[k] || {}; if (e.topic == null && e.topicKey == null) e.topic = k; return e; })
      : [];
    ls.forEach(function (e) { if (!e) return; var key = _normTopic(e.lessonKey || e.topic || e.topicKey || e.id || e.lesson || ''); if (key) _gradeByTopic[key] = e; });

    var qs = Array.isArray(g.quarters) ? g.quarters
      : (g.quarters && typeof g.quarters === 'object') ? Object.keys(g.quarters).map(function (k) { var e = g.quarters[k] || {}; if (e.quarter == null && e.label == null && e.key == null) e.key = k; return e; })
      : [];
    var best = null;
    qs.forEach(function (q) { if (q && typeof q.quarterGrade === 'number' && isFinite(q.quarterGrade)) best = q; });
    var pill = document.getElementById('gradepill');
    if (pill) {
      if (typeof window.a2StudentGradesHidden === 'function' && window.a2StudentGradesHidden()) {
        pill.textContent = 'Your grade is in Schoology for now.'; pill.style.display = '';
      } else if (best) { var ql = best.quarter || best.label || best.key || ''; pill.textContent = '📊 Current grade: ' + Math.round(best.quarterGrade) + '%' + (ql ? (' · ' + ql) : ''); pill.style.display = ''; }
      else { pill.style.display = 'none'; }

    if (repaint && _lastLessons.length) render(_lastLessons);

  // Returns a promise so callers can await a fresh floor before recording (see the
  // flashcards commit). Resolves (never rejects) even when offline / not signed in.
  function loadGrade() {
    if (!window.rosterClient || !rosterClient.current || !rosterClient.current()) return Promise.resolve(false);
    var base = svcUrl(); if (!base) return Promise.resolve(false);

      var missText;
      if (revealOnMiss) missText = (outcome === 'timeout' ? '⏱ Time’s up — answer shown' : '✗ Not quite');
      else if (outcome === 'timeout') missText = willStrike ? '⏱ Too slow — out (0 for this card)' : '⏱ Too slow — it’ll come back';
      else missText = willStrike ? '✗ Out (0 for this card)' : '✗ Not quite — it’ll come back';
      fb.textContent = correct ? '✓ Correct' : missText;
      fb.style.color = correct ? '#25663F' : '#B03A2E';
    }
    if (_fc.mode === 'quick') {
      if (correct) _fc.correct += 1;
      else _fcRememberMiss(card);
      _fcSrsAppend([{
        topic: String(_fc.lesson.id), qnum: card.qnum, correct: correct,
        latencyMs: latency, wasTimeout: outcome === 'timeout', missIndex: 0,
        ts: answeredAt, mode: 'quick', csv: _fc.csv, surface: 'mobile',
        roundId: _fc.roundId, seq: _fc.seq, nChoices: card.choices.length,
        chosenIdx: choiceIdx, stemHash: _fcStemHash(card.q),
        displayedPerm: Array.isArray(_fc.perm)
          ? _fc.perm.slice()
          : card.choices.map(function (_, choiceIndex) { return choiceIndex; })
      }]);
      _fc.seq += 1;
      _fcSaveQuickProgress();
      if (_fc.correct >= _fc.need) { setTimeout(function () { _fcFinish(); }, 700); return; }   // early-stop caps at 80%
    } else {
      FC.recordOutcome(_fc.round, outcome, latency);
      if (!correct) _fcRememberMiss(card);
      var logged = _fc.round.log[_fc.round.log.length - 1];
      if (logged) {
        logged.topic = String(_fc.lesson.id);
        logged.ts = answeredAt;
        logged.mode = 'full';
        logged.csv = _fc.csv;
        logged.surface = 'mobile';
        logged.roundId = _fc.roundId;
        logged.seq = _fc.seq;
        logged.nChoices = card.choices.length;
        logged.chosenIdx = choiceIdx;
        logged.stemHash = _fcStemHash(card.q);
        logged.displayedPerm = Array.isArray(_fc.perm)
          ? _fc.perm.slice()
          : card.choices.map(function (_, choiceIndex) { return choiceIndex; });
        _fcSrsAppend([logged]);
        _fc.seq += 1;
      }
    }
    var nx = document.getElementById('fc-next'); if (nx) nx.classList.add('show');
  }

  function _fcNext() {
    if (!_fc) return;
    if (_fc.mode === 'quick') {
      _fc.idx += 1;
      _fc.answered = false;
      _fcSaveQuickProgress();
    }
    _fcRender();
  }

  // The LOCAL-BEST half of the best-wins floor. Lives OUTSIDE _gradeByTopic because
  // _applyGradeData rebuilds that map from every /grade payload — a stale response
  // (the fire-and-forget refresh racing this run's own record POST) would wipe an
  // in-map bump, and a later run whose pre-commit refresh FAILS (offline / server
  // hiccup) could then emit a weaker score that the server's last-write-wins upsert
  // records over the better one. localStorage-backed so it also survives a reload
  // while the higher score is still queued. Scoped PER STUDENT (v2): the synced half
  // of the floor is the signed-in student's /grade, so on a shared classroom device
  // a device-global local best would let student A's 90 suppress student B's
  // legitimate 60. A signed-out run never persists a bump — it can't be keyed and
  // its write is dropped by gradebook-client anyway. Guarded by
  // tests/feeder-bestwins-invariants.property.test.js (prop 12b).
  var FC_BEST_KEY = 'a2_mobile_fcbest_v2';   // { username: { topicKey: score } }
  function _fcStudent() {
    try {
      var u = window.rosterClient && rosterClient.current && rosterClient.current();
      var name = u && u.username;
      return (typeof name === 'string' && name) ? name : null;
    } catch (_) { return null; }
  }
  function _fcLoadLocalBest() {
    try {
      localStorage.removeItem('a2_mobile_fcbest_v1');   // v1 was device-global (shared-device leak)
      var s = localStorage.getItem(FC_BEST_KEY);
      var m = s ? JSON.parse(s) : null;
      return (m && typeof m === 'object') ? m : {};
    } catch (_) { return {}; }
  }
  var _fcLocalBest = _fcLoadLocalBest();

  function _fcBlooketFloor(topic) {
    var key = _normTopic(topic);
    var who = _fcStudent();
    var synced = -1;
    if (who && _gradeOwner === who) {   // the synced map counts only for the student whose /grade filled it
      var e = _gradeByTopic[key];
      var v = e && (typeof e.blooket === 'number' ? e.blooket : (e.blooket && e.blooket.score));
      synced = (typeof v === 'number' && isFinite(v)) ? v : -1;
    }
    var mine = who && _fcLocalBest[who];
    var b = mine && mine[key];
    var local = (typeof b === 'number' && isFinite(b)) ? b : -1;
    return synced > local ? synced : local;
  }
  function _fcBumpLocalBlooket(topic, score) {
    var key = _normTopic(topic);
    var who = _fcStudent();
    if (who && typeof score === 'number' && isFinite(score)) {
      var mine = _fcLocalBest[who] || (_fcLocalBest[who] = {});
      var best = (typeof mine[key] === 'number') ? mine[key] : -1;
      if (score > best) {
        mine[key] = score;
        try { localStorage.setItem(FC_BEST_KEY, JSON.stringify(_fcLocalBest)); } catch (_) {}
      }
    }
    var e = _gradeByTopic[key] || (_gradeByTopic[key] = {});
    var cur = (typeof e.blooket === 'number') ? e.blooket : -1;
    if (score > cur) e.blooket = score;
  }

  // best-wins: never downgrade a recorded score; record the same ledger row the Desk
  // does (source 'worksheet' + BL-…-DESK_DONE → the server's Blooket track).
  function _fcCommit(topic, score) {
    var floor = _fcBlooketFloor(topic);
    if (!(score > floor)) return { skipped: true, floor: floor };
    var built = FC.blooketItemId(topic);
    var res = { ok: false, reason: 'no-client' };
    try {
      if (window.gradebookClient && window.gradebookClient.record) {
        res = window.gradebookClient.record({
          source: 'worksheet', itemId: built.itemId, unit: built.unit, topic: topic,
          response: { selfAttest: 'blooket' }, score: score, attempt: 1
        }) || res;
      }
    } catch (e) { res = { ok: false, reason: 'error' }; }
    _fcBumpLocalBlooket(topic, score);
    try { loadGrade(); } catch (_) {}   // refresh the pill/badges with the new record
    return res;
  }

  function _fcFinish() {
    _fcTimerStop();
    if (!_fc) return;
    var lesson = _fc.lesson, topic = String(lesson.id);
    var mode = _fc.mode;
    var misses = Array.isArray(_fc.misses) ? _fc.misses.slice() : [];
    var score, passed;
    if (_fc.mode === 'quick') { score = FC.quickScorePct(_fc.correct, _fc.deck.length); passed = FC.quickPassed(_fc.correct, _fc.deck.length); }
    else { score = FC.fullScorePct(_fc.round); passed = score >= (FC.PASS_THRESHOLD * 100); }
    // Quick records only on pass (Desk behavior); the full deck always records its score.
    var doCommit = (_fc.mode === 'quick') ? passed : true;
    if (_fc.mode === 'quick' && passed) _fcClearQuickProgress(topic);
    fcoEl().classList.remove('timed');
    _fc = null;

    function finishCommit() {
      var committed = doCommit ? _fcCommit(topic, score) : { skipped: true };
      Promise.resolve(committed).then(function (c) {
        _fcRenderResult(lesson, score, passed, c || { ok:false, reason:'error' }, misses, mode);
      }, function () {
        _fcRenderResult(lesson, score, passed, { ok:false, reason:'error' }, misses, mode);
      });
    }
    // Desk parity: refresh /grade FIRST so the best-wins floor reflects any higher
    // score recorded on another device, THEN commit (a cold session can't downgrade).
    Promise.resolve(loadGrade()).then(finishCommit, finishCommit);
  }

  function _fcRenderResult(lesson, score, passed, committed, misses, mode) {
    var note;
    if (committed && committed.skipped && !passed && score < 80) note = 'Reach 80% for the Blooket half of Done — your grade wasn’t lowered.';
    else if (committed && committed.skipped) note = 'Kept your best score — a higher one is already recorded.';
    else if (committed && committed.queued) note = 'Saved offline — it’ll sync when you reconnect.';
    else if (committed && committed.ok === false) note = (committed.reason === 'no-identity' || committed.reason === 'no-client') ? 'Sign in to save this to your grade.' : 'Couldn’t save right now — try again when online.';
    else note = passed ? '🎯 Recorded — that’s the Blooket half of Done (the worksheet 60% is also needed).' : 'Score recorded. Reach 80% for the Blooket half of Done — the worksheet 60% is also needed.';
    _fcBodyHtml(
      '<div class="fc-result">' +
        '<h2>' + (passed ? '🎉 Passed!' : 'Keep going') + '</h2>' +
        '<div class="fc-score ' + (passed ? 'pass' : 'fail') + '">' + (Math.round(score * 10) / 10) + '%</div>' +
        '<div id="fc-recap-slot"></div>' +
        '<p>' + esc(note) + '</p>' +
        '<button class="fc-mode quick" id="fc-again">↻ Try again</button>' +
        '<button class="fc-mode full" id="fc-done">✓ Done</button>' +
      '</div>');
    var recapSlot = document.getElementById('fc-recap-slot');
    if (recapSlot) {
      var recap = document.createElement('div');
      recap.className = 'fc-recap';
      if (Array.isArray(misses) && misses.length) {
        var heading = document.createElement('strong');
        heading.textContent = 'Review your misses';
        recap.appendChild(heading);
        var list = document.createElement('ul');
        var worksheetUrl = lesson && lesson.worksheet ? lesson.worksheet : null;
        for (var i = 0; i < misses.length; i++) {
          var item = document.createElement('li');
          var stem = document.createElement('div');
          var stemText = String(misses[i].q == null ? '' : misses[i].q);
          stem.textContent = stemText;
          item.appendChild(stem);
          var answer = document.createElement('div');
          answer.className = 'fc-recap-answer';
          answer.textContent = 'Answer: ' + misses[i].correctAnswer;
          item.appendChild(answer);
          if (worksheetUrl) {
            var fragmentText = stemText.trim().split(/\s+/).slice(0, 6).join(' ');
            var reviewLink = document.createElement('a');
            reviewLink.href = worksheetUrl + '#:~:text=' + encodeURIComponent(fragmentText);
            reviewLink.target = '_blank';
            reviewLink.rel = 'noopener';
            reviewLink.textContent = 'Review in the worksheet ↗';
            item.appendChild(reviewLink);
          }
          list.appendChild(item);
        }
        recap.appendChild(list);
      } else {
        recap.className += ' fc-perfect';
        recap.textContent = 'Perfect — no misses!';
      }
      recapSlot.parentNode.replaceChild(recap, recapSlot);
    }
    document.getElementById('fc-again').onclick = function () {
      if (mode === 'quick' && !passed) _fcClearQuickProgress(String(lesson.id));
      openFlashcards(lesson);
    };
    document.getElementById('fc-done').onclick = function () { closeFlashcards(); };
    _fcSetProg('');
  }

  // Keyboard (desktop testers): Esc closes, 1-4/a-d answer, Enter/Space advances.
  document.addEventListener('keydown', function (e) {
    var el = fcoEl(); if (!el || !el.classList.contains('show')) return;
    if (e.key === 'Escape') { closeFlashcards(); return; }
    if (!_fc) return;
    var key = String(e.key || '').toLowerCase();
    var i = /^[1-4]$/.test(key) ? parseInt(key, 10) - 1 : 'abcd'.indexOf(key);
    if (!_fc.answered && i >= 0) {
      var card = _fcCurrentCard();
      if (!card) return;
      var displayedCount = (_fc.perm && typeof _fc.perm.length === 'number')
        ? _fc.perm.length
        : card.choices.length;
      if (i >= displayedCount) return;
      var real = (_fc && _fc.perm && _fc.perm[i] != null) ? _fc.perm[i] : i;
      _fcAnswer(real);
    } else if (_fc.answered && (e.key === 'Enter' || e.key === ' ')) {
      var nx = document.getElementById('fc-next');
      if (nx && nx.classList.contains('show')) { e.preventDefault(); _fcNext(); }
    }
  });

  // Cached grade → first paint has the pill + ✓ badges even offline. The cache is
  // device-global: honor its owner stamp so another student's cached grades never
  // feed the current student's best-wins floor (old unstamped caches → owner null).
  try {
    var _cg = localStorage.getItem(GRADE_KEY);
    if (_cg) {
      var _cgp = JSON.parse(_cg);
      _gradeOwner = (_cgp && typeof _cgp.owner === 'string') ? _cgp.owner : null;
      _applyGradeData(_cgp, false);
    }
  } catch (_) {}

  // Allow host overrides while retaining a fallback when config scripts are absent.
  var _WS_BASE = (window.A2_CONFIG && window.A2_CONFIG.WORKSHEET_BASE_URL)
    || window.WORKSHEET_BASE_URL
    || 'https://robjohncolson.github.io/a2-live-worksheets/';
  _WS_BASE = _WS_BASE.replace(/\/?$/, '/');
  
  // Web-vs-APK signal: offline-config.js (pack only) sets window.OFFLINE_MODE = true.
  // On the web that script 404s harmlessly and OFFLINE_MODE stays falsy.
  // Match offline-queue.js: true or '1' (pack builders may emit either).
  function isOfflinePack() { return window.OFFLINE_MODE === true || window.OFFLINE_MODE === '1'; }
  // G1 / H0: lessons-index stores relative quiz/index.html?u=&l= for the APK bundle.
  // That relative path 404s on GH Pages (no /quiz published under WS_BASE). On web,
  // rewrite relative quiz paths to absolute CR origin; keep ?u=&l= (and #) intact.
  // Absolute quiz URLs (roadmap fallback / already-CR) pass through unchanged.
  // APK keeps the relative form so offline bundled quiz/ still works.
  // Does NOT mutate lessons-index.json — resolution is display-time only.
  
  function _relWs(u) { return (typeof u === 'string' && u.indexOf(_WS_BASE) === 0) ? u.slice(_WS_BASE.length) : (u || null); }
  function _lessonsFromRoadmap(roadmap) {
    var L = (roadmap && roadmap.lessons) || {};
    var out = Object.keys(L).map(function (id) {
      var u = (L[id] && L[id].urls) || {};
      var lesson = {
        id: id, unit: parseInt(id, 10) || 0, label: (L[id] && L[id].topic) || ('Topic ' + id),
        worksheet: _relWs(u.worksheet), quiz: u.quiz || null, blooket: u.blooket || null
      };
      // Missing metadata uses the shared fallback; an explicit null stays explicit.
      if (L[id] && Object.prototype.hasOwnProperty.call(L[id], 'ced2026')) lesson.ced2026 = L[id].ced2026;
      return lesson;
    });
    out.sort(function (a, b) {
      if (a.unit !== b.unit) return a.unit - b.unit;
      return ((parseInt(String(a.id).split('.')[1], 10) || 0) - (parseInt(String(b.id).split('.')[1], 10) || 0));
    });
    return out;
  }
  function _bootLessons(lessons) {
    _lastLessons = (lessons || []).map(function (lesson) {
      if (!lesson.key) return lesson;
      return Object.assign({}, lesson, { id: String(lesson.key).replace('-', '.') });
    });
    cedRegistry = { lessons: {} };
    _lastLessons.forEach(function (lesson) { cedRegistry.lessons[lesson.id] = lesson; });
    try { _fcRebuildTopicCsvMapFromLessons(_lastLessons); } catch (_) {}
    try { _fcLoadTopicCsvMap(); } catch (_) {}
    render(_lastLessons);
    loadGrade();
  }

  // Published lessons remain available when the roster service is offline.
  // The service may provide newer lesson dates or content when it is reachable.
  fetch('content/a2/lessons.json')
    .then(function (response) {
      if (!response || !response.ok) throw new Error('Lessons unavailable');
      return response.json();
    })
    .catch(function () { return []; })
    .then(function (published) {
      if (Array.isArray(published) && published.length) _bootLessons(published);
      var base = typeof window.ROSTER_SERVICE_URL === 'string'
        ? window.ROSTER_SERVICE_URL.replace(/\/$/, '') : '';
      if (!base) {
        if (!_lastLessons.length) _bootLessons([]);
        return;
      }
      return fetch(base + '/lessons')
        .then(function (response) {
          if (!response || !response.ok) throw new Error('Live lessons unavailable');
          return response.json();
        })
        .then(function (data) {
          var lessons = Array.isArray(data) ? data : data && data.lessons;
          if (Array.isArray(lessons) && lessons.length) _bootLessons(lessons);
        })
        .catch(function () { /* Keep the published model while offline. */ })
        .then(function () { if (!_lastLessons.length) _bootLessons([]); });
    });
})();
</script>
</body>
</html>
