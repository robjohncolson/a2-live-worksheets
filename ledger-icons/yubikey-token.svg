<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ledger key">
  <defs>
    <linearGradient id="yk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2F7"/>
      <stop offset=".5" stop-color="#AEB7C2"/>
      <stop offset="1" stop-color="#7C8794"/>
    </linearGradient>
  </defs>
  <!-- yubikey-style token body -->
  <rect x="22" y="6" width="20" height="52" rx="10" fill="url(#yk)" stroke="#5b6470" stroke-width="2"/>
  <!-- keyring hole -->
  <circle cx="32" cy="13" r="3.2" fill="none" stroke="#5b6470" stroke-width="2"/>
  <!-- gold touch sensor with keyhole -->
  <circle cx="32" cy="31" r="6.6" fill="#F2B43D" stroke="#b07d1e" stroke-width="1.5"/>
  <circle cx="32" cy="29.4" r="1.8" fill="#7a4e0e"/>
  <rect x="31.2" y="29.8" width="1.6" height="4.2" rx=".8" fill="#7a4e0e"/>
  <!-- ledger register ticks -->
  <g stroke="#5b6470" stroke-width="2" stroke-linecap="round">
    <line x1="27" y1="45" x2="37" y2="45"/>
    <line x1="27" y1="50" x2="37" y2="50"/>
  </g>
</svg>
