<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra 2 · Teacher scoring and pacing</title>
<link rel="stylesheet" href="a2-announcement.css">
<style>body{font:16px system-ui;margin:16px;background:#f6f5ee}button,input,select{font:inherit;min-height:44px;min-width:44px;margin:3px}button{cursor:pointer}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:5px}th:first-child{position:sticky;left:0;background:#fff;max-width:100px;overflow-wrap:anywhere}td button{width:48px;height:48px}#grid{overflow:auto}input[type=number]{width:75px}.pending{background:#fff1b8}.badge{display:block;font-size:11px;color:#9a3200}fieldset{margin:15px 0}#message{min-height:24px}details p{white-space:pre-wrap}small{overflow-wrap:anywhere}.student-card{background:white;padding:12px;margin:12px 0;border:1px solid #aaa;border-radius:8px;max-width:480px}.student-card h2{font-size:1.1rem;margin:0 0 8px}.score-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.score-controls button{min-width:64px;min-height:56px;font-weight:bold}.score-controls [aria-pressed=true]{background:#174f3c;color:white}.score-controls select{min-height:56px}.score-value{display:block;margin:8px 0}#collection{min-height:56px}#scoring-tools{position:sticky;top:0;background:#f6f5ee;padding:8px 0;z-index:2}button:focus-visible,select:focus-visible{outline:3px solid #1756a9}</style>
<a href="desk.html">← Desk</a><h1>Teacher scoring</h1>
<span data-a2-announcement class="a2-announcement" hidden></span>
<p>Sign in as a teacher on the Desk, or enter a teacher key for this page.</p>
<label>Teacher key <input id="secret" type="password" autocomplete="off"></label>
<label>Section <select id="section"><option>C</option><option>D</option><option>G</option></select></label>
<label>Lesson <select id="lesson"></select></label><button id="load">Load</button>
<nav><button id="tryits">Try-Its</button><button id="quizzes">Quizzes</button><button id="assessments">Topic assessments</button><button id="pacing">Pacing…</button></nav>
<p id="message" role="status" aria-live="polite"></p><div id="scoring-tools" hidden><label id="item-label">Try-It <select id="item"></select></label><button id="collection">Collected today</button><span id="collection-status"></span></div><div id="grid"></div><div id="prompts"></div>
<script src="roster_config.js"></script><script src="roster-client.js"></script><script src="offline-queue.js"></script><script src="a2-client.js"></script>
<script src="grade-engine.bundle.js"></script><script src="a2-announcement.js"></script>
<script>
(function () {
  const el = id => document.getElementById(id);
  const api = (path, body, method) => A2Client.request(path, body, method, el('secret').value);
  let lessons = [], mode = new URLSearchParams(location.search).get('mode') || 'tryits';
  // Pacing overlay rows for every lesson the server knows, and the year plan
  // (data/a2-lesson-targets.json) so unpublished planned lessons can be dated too.
  let pacingOverlay = {}, yearPlan = null;
  let sending = Promise.resolve(), loadVersion = 0, sequence = Date.now();
  function say(text) { el('message').textContent = text; }
  async function send(record) {
    try { await api('/ledger/record', record); A2Client.changed(); return { ok: true }; }
    catch (error) { say(error.status ? error.message + ' — score remains queued for review.' : 'Offline — scores are saved on this device.'); return { ok: false }; }
  }
  function flush() {
    sending = sending.catch(() => {}).then(() => OfflineQueue.drain(record => record.source === 'try-it' || record.source === 'topic-assessment' || record.source === 'quiz' ? send(record) : Promise.resolve({ ok: false })));
    return sending;
  }
  async function saveScore(student, itemId, source, score, control, questionScores) {
    const record = { source, itemId, studentId: student.studentId || student.student_id,
      score, maxPoints: source === 'try-it' ? 10 : source === 'quiz' ? 20 : 100, lesson: el('lesson').value,
      attempt: 1, ...(questionScores ? { questionScores: [...questionScores] } : {}), transportSequence: ++sequence,
      requestId: crypto.randomUUID(), ts: Date.now() };
    control.classList.add('pending');
    await OfflineQueue.enqueue(record); // Capture before the network request, including rapid taps.
    say('Saving…'); await flush();
    const pending = (await OfflineQueue.all()).some(row => row.requestId === record.requestId);
    if (!pending) { control.classList.remove('pending'); say('Saved'); }
  }
  function text(tag, value, host) { const node = document.createElement(tag); node.textContent = value; host.append(node); return node; }
  function scoreControls(host, label, initial, onScore) {
    const group = text('div', '', host); group.className = 'score-controls';
    group.setAttribute('role', 'group'); group.setAttribute('aria-label', label);
    const value = text('output', initial == null ? 'Not scored' : initial + ' / 10', host);
    value.className = 'score-value';
    const choose = score => {
      value.textContent = score + ' / 10';
      group.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(Number(button.textContent) === score)));
      select.value = [10, 8, 0].includes(score) ? '' : String(score);
      onScore(score);
    };
    [10, 8, 0].forEach(score => {
      const button = text('button', score, group);
      button.setAttribute('aria-label', label + ': ' + score + ' points');
      button.setAttribute('aria-pressed', String(initial === score));
      button.onclick = () => choose(score);
    });
    const select = text('select', '', group); select.setAttribute('aria-label', label + ': other score');
    text('option', 'Other?', select).value = '';
    [1, 2, 3, 4, 5, 6, 7, 9].forEach(score => { text('option', score, select).value = score; });
    select.value = initial != null && ![10, 8, 0].includes(initial) ? String(initial) : '';
    select.onchange = () => { if (select.value !== '') choose(Number(select.value)); };
  }
  async function scoringCards(students, lesson, version) {
    const section = el('section').value;
    const quiz = mode === 'quizzes';
    el('scoring-tools').hidden = false;
    el('item-label').hidden = quiz; el('collection').hidden = quiz;
    const assigned = lesson.assignedDates?.[section];
    el('collection-status').textContent = quiz ? 'Two questions ? 10 points each' : assigned ? 'Collected ' + assigned : 'Not collected';
    el('collection').disabled = !!assigned;
    el('collection').onclick = async () => {
      el('collection').disabled = true;
      try {
        const result = await api('/teacher/tryits/collected', { lesson: lesson.key, section }, 'PUT');
        if (version !== loadVersion) return;
        el('collection-status').textContent = 'Collected ' + result.assignedDate;
        say('Set assigned to section ' + section); A2Client.changed();
      } catch (error) { say(error.message + ' ? collection was not saved. Tap again to retry.'); el('collection').disabled = false; }
    };
    const selected = el('item').value; el('item').textContent = '';
    lesson.tryIts.forEach(item => { text('option', 'Try-It ' + item.n, el('item')).value = item.n; });
    if ([...el('item').options].some(option => option.value === selected)) el('item').value = selected;
    const itemId = quiz ? 'QZ-' + lesson.key : 'TI-' + lesson.key + '-' + el('item').value;
    const pending = await OfflineQueue.all();
    const records = await Promise.all(students.map(async student => {
      const id = student.studentId || student.student_id;
      const ledger = await api('/ledger/student/' + encodeURIComponent(id));
      const status = quiz ? null : await api('/lesson-status/' + lesson.key + '?studentId=' + encodeURIComponent(id));
      const rows = ledger.rows || ledger.items || ledger.ledger || [];
      const previous = rows.filter(row => row.item_id === itemId && row.source === (quiz ? 'quiz' : 'try-it'))
        .sort((a, b) => b.attempt - a.attempt || String(b.recorded_at).localeCompare(String(a.recorded_at)))[0];
      const queued = pending.find(row => row.studentId === id && row.itemId === itemId);
      return { student, previous, queued, rescoreRequested: status?.tryIts?.scores.find(item => item.itemId === itemId)?.rescoreRequested };
    }));
    if (version !== loadVersion) return;
    for (const { student, previous, queued, rescoreRequested } of records) {
      const card = text('section', '', el('grid')); card.className = 'student-card';
      text('h2', student.realName || student.real_name || student.username || student.login_username, card);
      if (rescoreRequested) text('span', 'Rescore requested', card).className = 'badge';
      if (queued) card.classList.add('pending');
      const persist = (score, questions) => saveScore(student, itemId, quiz ? 'quiz' : 'try-it', score, card, questions)
        .then(() => { if (!card.classList.contains('pending')) card.querySelector('.badge')?.remove(); })
        .catch(error => say(error.message));
      if (quiz) {
        const questions = [...(queued?.questionScores || previous?.response?.questionScores || [null, null])];
        [0, 1].forEach(index => {
          text('h3', 'Question ' + (index + 1), card);
          scoreControls(card, 'Question ' + (index + 1), questions[index], score => {
            questions[index] = score;
            if (questions.every(value => value != null)) persist(questions[0] + questions[1], questions);
            else say('Choose a score for both questions to save this quiz.');
          });
        });
      } else scoreControls(card, 'Try-It ' + el('item').value, queued?.score ?? previous?.score, score => persist(score));
    }
    if (!quiz) {
      const item = lesson.tryIts.find(item => String(item.n) === el('item').value);
      if (item) { const details = text('details', '', el('prompts')); text('summary', 'Try-It ' + item.n + ' prompt', details); text('p', item.prompt, details); }
    }
  }
  async function pacing() {
    el('grid').textContent = ''; el('prompts').textContent = '';
    A2Announcement.mountEditor(el('grid'), api);
    const form = document.createElement('form'); el('grid').append(form);
    if (!yearPlan) { try { yearPlan = await (await fetch('data/a2-lesson-targets.json')).json(); } catch (_) { yearPlan = { lessons: [] }; } }
    const published = new Set(lessons.map(lesson => lesson.key));
    // Planned (unpublished) lessons from the year plan: the saved overlay wins over the
    // generated dates; the overlay applies automatically once the lesson is published.
    const planned = (yearPlan.lessons || []).filter(lesson => !published.has(lesson.key) && lesson.plan !== 'later' && (pacingOverlay[lesson.key]?.sections || lesson.sections))
      .map(lesson => ({ ...lesson, planned: true, sections: pacingOverlay[lesson.key]?.sections || lesson.sections, onenoteUrl: pacingOverlay[lesson.key]?.onenoteUrl || null }));
    [...lessons, ...planned].forEach(lesson => {
      const group = document.createElement('fieldset'); group.dataset.lesson = lesson.key; form.append(group);
      text('legend', lesson.key + ' ' + lesson.title + (lesson.planned ? ' (planned, not published)' : ''), group);
      ['C', 'D', 'G'].forEach(section => { const label = text('label', section, group); const input = document.createElement('input'); input.type = 'date'; input.name = section; input.value = lesson.sections?.[section] || ''; label.append(input); });
      const label = text('label', 'OneNote URL', group); const url = document.createElement('input'); url.type = 'url'; url.name = 'onenote'; url.placeholder = 'https://…'; url.value = lesson.onenoteUrl || ''; label.append(url);
    });
    const save = text('button', 'Save pacing', form); save.type = 'submit';
    form.onsubmit = async event => {
      event.preventDefault(); save.disabled = true;
      try {
        const changes = Array.from(form.querySelectorAll('fieldset')).map(group => ({ key: group.dataset.lesson,
          sections: Object.fromEntries(['C','D','G'].map(section => [section, group.querySelector('[name="' + section + '"]').value || null])),
          onenoteUrl: group.querySelector('[name=onenote]').value || null }));
        const saved = await api('/teacher/lessons', { lessons: changes }, 'PUT');
        lessons = saved.lessons; pacingOverlay = saved.pacing || {};
        say('Pacing saved'); A2Client.changed();
      } catch (error) { say(error.message); } finally { save.disabled = false; }
    };
  }
  async function load() {
    const version = ++loadVersion;
    el('scoring-tools').hidden = true;
    el('grid').textContent = ''; el('prompts').textContent = '';
    try {
      say('Loading…');
      const served = await api('/teacher/lessons');
      if (version !== loadVersion) return;
      lessons = served.lessons; pacingOverlay = served.pacing || {};
      const selected = el('lesson').value;
      el('lesson').textContent = '';
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
      lessons.forEach(lesson => { const option = text('option', lesson.key + ' ' + lesson.title, el('lesson')); option.value = lesson.key; });
      el('lesson').value = selected || lessons.find(lesson => lesson.sections?.[el('section').value] >= today)?.key || lessons.at(-1)?.key;
      if (mode === 'pacing') { await pacing(); say(''); return; }
      const roster = await api('/roster/list');
      const students = (roster.students || roster.roster || []).filter(student => String(student.section).replace(/^Period/i, '') === el('section').value && student.role !== 'teacher');
      if (version !== loadVersion) return;
      const lesson = lessons.find(item => item.key === el('lesson').value);
      if (!lesson) { say('No published lessons'); return; }
      el('grid').textContent = ''; el('prompts').textContent = '';
      if (mode === 'tryits' || mode === 'quizzes') {
        await scoringCards(students, lesson, version);
        if (version !== loadVersion) return;
        say(students.length + ' students'); await flush(); return;
      }
      const table = document.createElement('table'); el('grid').append(table);
      const header = document.createElement('tr'); table.append(header); text('th', 'Student', header);
      const topics = [...new Set(lessons.map(item => item.topicAssessmentKey))];
      (mode === 'assessments' ? topics.map(key => 'Topic assessment ' + key) : lesson.tryIts.map(item => 'Try-It ' + item.n)).forEach(label => text('th', label, header));
      for (const student of students) {
        const id = student.studentId || student.student_id;
        const row = document.createElement('tr'); table.append(row); text('th', student.realName || student.real_name || student.username || student.login_username, row);
        if (mode === 'assessments') {
          const ledger = await api('/ledger/student/' + encodeURIComponent(id));
          const rows = ledger.rows || ledger.items || ledger.ledger || [];
          for (const key of topics) {
            const cell = document.createElement('td'); row.append(cell); const input = document.createElement('input'); input.type = 'number'; input.min = 0; input.max = 100; input.step = 'any'; input.setAttribute('aria-label', 'Topic assessment ' + key); cell.append(input);
            const previous = rows.filter(item => item.source === 'topic-assessment' && item.item_id === 'TA-' + key).sort((a,b) => b.attempt - a.attempt)[0]; input.value = previous?.score ?? '';
            input.onchange = () => { if (input.value !== '' && input.checkValidity()) saveScore(student, 'TA-' + key, 'topic-assessment', Number(input.value), input).catch(error => say(error.message)); };
          }
        }
      }
      say(students.length + ' students'); await flush();
    } catch (error) { say(error.message); }
  }
  el('load').onclick = load;
  el('item').onchange = load;
  el('section').onchange = () => { el('lesson').textContent = ''; load(); };
  el('lesson').onchange = load;
  ['tryits','quizzes','assessments','pacing'].forEach(view => { el(view).onclick = () => { mode = view; load(); }; });
  window.addEventListener('online', async () => { await flush(); await load(); });
  load();
})();
</script></html>
