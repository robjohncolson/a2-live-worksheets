name: Deploy Algebra 2 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static repo root
        run: |
          mkdir -p "$RUNNER_TEMP/a2-pages"
          rsync -a --exclude-from=.vercelignore ./ "$RUNNER_TEMP/a2-pages/"
          touch "$RUNNER_TEMP/a2-pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/a2-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
